<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/secret_santa.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    
    <body>
        <header style="display: none;">Secret Santa</header>
        <div id="nav">
            <button id="logout-button" class="nav-button" style="display: none;">logout</button>
            <button class="admin-link nav-button" style="display: none;"><a href="admin.html">Admin</a></button>
        </div>
        
        <div class="login-prompt">
            <div class="login-head">
                <h1>Secret Santa</h1>
                <h3>Enter your Pin Number</h3>
            </div>
            
            <div class="login-form">
                <span class="alert alert-error" id="error-banner" style="display: none"></span>
                <input type="text" id="pin-input" placeholder= "####">
                <input type="submit" id="pin-submit" value="Login">
            </div>
        </div>

        <div class="logged-in" style="display: none;">
            <span id="top-container">
                <h2 id="welcome-message">Hello User!</h2>
                <span id="prompt">
                    <p id="logged-in-prompt">Login Success!</p>
                    <button id="match-button" style="display: none;">Match</button>
                </span>

                <span id="receiver-wishlist-container" style="display: none;">
                    <h3 id="receiver-wishlist-title">Your Match's Wishlist</h3>
                    <ul id="receiver-wishlist-items">

                    </ul>
                </span>
            </span>

            <span id="wishlist-container">
                <span id="wishlist-header-container">
                    <h3>Your Wishlist</h3>
                    <button id="add-item">Add Item</button>
                </span>
                <div id="add-item-form" style="display: none;">
                    <span id="new-item-form-container">
                        <input type="text" id="new-item-name" class="new-item-input" placeholder="Item name">
                        <input type="url" id="new-item-link" class="new-item-input" placeholder="Item link (URL)">
                    </span>
                    <span id="new-item-button-container">
                        <button id="save-new-item" class="new-item-button">Add</button>
                        <button id="cancel-add-item" class="new-item-button">Cancel</button>
                    </span>
                 </div>
                 <p>Add items or an external list and your Secret Santa will see them!</p>
                <ul id="wishlist-items">

                </ul>
            </span>
        </div>

        <script src="config.js"></script>
        <script src="secret_santa.js"></script>
    </body>
</html>
